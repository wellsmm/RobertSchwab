name: Build and deploy Robert Schwab website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: robertschwab-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install image conversion libraries
        run: python -m pip install "Pillow>=11,<13" "pillow-heif>=1,<2"
      - name: Convert HEIC and optimize original photographs
        run: python scripts/build_images.py
      - name: Check JavaScript and website assets
        run: |
          node --version
          node --check assets/site.js
          python scripts/check_site.py
      - name: Prepare deploy directory
        run: |
          mkdir -p _site/assets
          cp index.html apparel.html jigs.html gallery.html about.html contact.html faq.html privacy.html .nojekyll robots.txt sitemap.xml _site/
          cp assets/site.css assets/site.js _site/assets/
          cp -R assets/images _site/assets/images
      # GitHub Pages must be enabled once by the repo owner in Settings > Pages.
      # The GITHUB_TOKEN cannot create a Pages site when the repository is not enabled.
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true # Preserve the .nojekyll file in Pages deployment
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
